name: keepalive

# GitHub silently disables scheduled workflows in a repo that has had no commits
# for 60 days. A monthly no-op commit keeps the API watch alive forever.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "offerplay-uptime-bot"
          git config user.email "offerplay-uptime-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: $(date -u +%F)" || exit 0
          git push
