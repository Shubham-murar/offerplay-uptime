name: OfferPlay API watch

# Probes the production API every 5 minutes the way the mobile app does — and
# demands real JSON. A plain "is it up?" check passed straight through the
# 2026-10-01 outage, because the server answered HTTP 200 with an HTML
# bot-challenge page ("One moment, please…"). This catches exactly that.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a TEST emergency alert to the founders (no real outage)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: api-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: https://api.offerplay.in
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
    steps:
      - name: Probe the API like a real app client
        id: probe
        shell: bash
        run: |
          set +e
          : > failures.txt
          probe() {  # url  expected-substring  label
            local url="$1" expect="$2" label="$3" ok=0 reason=""
            for attempt in 1 2 3; do
              hdr=$(mktemp); body=$(mktemp)
              code=$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' --max-time 25 \
                     -A "OfferPlay-Watch/1.0 (github-actions)" "$url")
              ctype=$(grep -i '^content-type:' "$hdr" | tr -d '\r' | awk '{print tolower($2)}')
              if [[ "$ctype" == application/json* ]] && grep -q "$expect" "$body"; then ok=1; break; fi
              if grep -qi 'One moment, please' "$body" || [[ "$ctype" == text/html* ]]; then
                reason="HTML bot-challenge page instead of JSON (Cloudways anti-bot / WebShield is challenging API traffic)"
              elif [[ "$code" == "000" ]]; then
                reason="unreachable (connection failed or timed out)"
              else
                reason="HTTP $code, content-type '${ctype:-none}', expected '$expect'"
              fi
              [[ $attempt -lt 3 ]] && sleep 20
            done
            if [[ $ok == 1 ]]; then echo "OK    $label"; else echo "FAIL  $label -> $reason"; echo "- $label: $reason" >> failures.txt; fi
          }
          probe "$API/health"                  '"status":"ok"'   "node-health"
          probe "$API/health/ready"            '"db":"up"'       "database (health/ready)"
          probe "$API/api/app/feature-flags"   '"success":true'  "api-feature-flags"
          probe "$API/api/redeem/packages"     '"success":false' "api-redeem-packages (401 JSON expected)"
          if [[ -s failures.txt ]]; then
            echo "down=true" >> "$GITHUB_OUTPUT"
            { echo 'detail<<EOF'; cat failures.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Was the API really down on the previous run? (for recovery notice)
        id: prev
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a run whose "Mark the run red" step failed counts as a REAL outage.
          # A workflow-file error or a test run must never trigger a "recovered" notice.
          prev_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow api-watch.yml --status completed --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          was_down=false
          if [[ -n "$prev_id" ]]; then
            n=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$prev_id/jobs" \
                 -q '[.jobs[].steps[] | select(.name=="Mark the run red while the API is down" and .conclusion=="failure")] | length' 2>/dev/null || echo 0)
            [[ "${n:-0}" -gt 0 ]] && was_down=true
          fi
          echo "was_down=$was_down" >> "$GITHUB_OUTPUT"

      - name: Alert founders (ntfy + Telegram)
        if: steps.probe.outputs.down == 'true' || github.event.inputs.test_alert == 'true'
        shell: bash
        run: |
          IST_NOW="$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')"
          # The advice must match the failure. On 2026-10-02 a DATABASE outage went out with the
          # anti-bot instructions, which would have sent the founders to the wrong dashboard.
          DETAIL="${{ steps.probe.outputs.detail }}"
          if grep -qi 'bot-challenge' <<<"$DETAIL"; then
            FIX="What to do: Cloudways -> Server -> Security -> Firewall -> (gear) -> turn anti-bot / Splash Screen OFF, or ask Cloudways support to whitelist api.offerplay.in in WebShield. Then confirm https://api.offerplay.in/api/app/feature-flags returns JSON."
          elif grep -qi 'node-health' <<<"$DETAIL"; then
            FIX="What to do: the SERVER itself is not answering. Cloudways -> Server -> check it is running, then restart the backend (pm2 restart offerplay-backend). Then confirm https://api.offerplay.in/health returns JSON."
          else
            FIX="What to do: this is the DATABASE, not the firewall - do NOT change Cloudways anti-bot settings. Supabase dashboard -> OfferPlay project -> look for a warning banner, then Reports -> Database (CPU, memory, Disk IO). If it is maxed out, upgrade the compute size (Project Settings -> Compute and Disk). Then confirm https://api.offerplay.in/health/ready shows db up."
          fi
          if [[ "${{ steps.probe.outputs.down }}" == "true" ]]; then
            TITLE="REAL OUTAGE: OfferPlay API is DOWN"
            PRIORITY=5; TAGS="rotating_light,sos"
            MSG="THIS IS REAL - not a test."$'\n'"Time: ${IST_NOW}"$'\n'"The API is failing for users:"$'\n'"${{ steps.probe.outputs.detail }}"$'\n\n'"${FIX}"
          else
            TITLE="TEST ONLY - OfferPlay alert test (API is fine)"
            PRIORITY=4; TAGS="test_tube"
            MSG="This is only a TEST of the emergency alert. Nothing is wrong - the API is working normally."$'\n'"Time: ${IST_NOW}"$'\n'"A real outage alert will start with the words REAL OUTAGE."
          fi
          if [[ -n "$NTFY_TOPIC" ]]; then
            curl -sS -o /dev/null -w "ntfy push: HTTP %{http_code}\n" \
              -H "Title: $TITLE" -H "Priority: $PRIORITY" -H "Tags: $TAGS" \
              -H "Click: https://admin.offerplay.in" \
              --data-binary "$MSG" "https://ntfy.sh/$NTFY_TOPIC"
          else
            echo "::warning::NTFY_TOPIC secret is not set - no push sent"
          fi
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_IDS" ]]; then
            for id in ${TELEGRAM_CHAT_IDS//,/ }; do
              curl -sS -o /dev/null -w "telegram($id): HTTP %{http_code}\n" \
                "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$id" --data-urlencode "text=${TITLE}"$'\n'"${MSG}"
            done
          fi

      - name: Recovery notice
        if: steps.probe.outputs.down == 'false' && steps.prev.outputs.was_down == 'true' && github.event.inputs.test_alert != 'true'
        shell: bash
        run: |
          IST_NOW="$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')"
          MSG="Good news - the API is serving JSON again for users. All checks pass, including the database."$'\n'"Time: ${IST_NOW}"
          [[ -n "$NTFY_TOPIC" ]] && curl -sS -o /dev/null -w "ntfy push: HTTP %{http_code}\n" \
              -H "Title: RESOLVED: OfferPlay API is back" -H "Priority: 3" -H "Tags: white_check_mark" \
              --data-binary "$MSG" "https://ntfy.sh/$NTFY_TOPIC"
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_IDS" ]]; then
            for id in ${TELEGRAM_CHAT_IDS//,/ }; do
              curl -sS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$id" --data-urlencode "text=RESOLVED: OfferPlay API is back"$'\n'"${MSG}"
            done
          fi

      - name: Mark the run red while the API is down
        if: steps.probe.outputs.down == 'true'
        run: |
          echo "::error::API is down - see probe output above"
          exit 1
